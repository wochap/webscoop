<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-53929d40-05df-499c-bc14-17884e999fc5/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="_ds/nocturne-53929d40-05df-499c-bc14-17884e999fc5/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:4px;width:100%;min-width:0;font-family:var(--font-body)">
  <div style="display:flex;align-items:stretch;height:28px;box-sizing:border-box;border-radius:5px;border:1px solid {{ border }};background:color-mix(in srgb,var(--color-surface) 55%,var(--color-bg));box-shadow:{{ glow }};overflow:hidden;min-width:0">
    <button title="Strategy" style="flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;border:0;border-right:1px solid var(--color-neutral-800);background:transparent;color:var(--color-neutral-300);font:700 10.5px/1 'JetBrains Mono',monospace;cursor:pointer" style-hover="background:var(--color-neutral-900)">
      <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><i class="{{ glyphIcon }}" style="font-size:11px"></i></sc-if>
      <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}"><span>{{ glyphText }}</span></sc-if>
      <span style="font:500 10.5px/1 var(--font-body);color:var(--color-neutral-400)">{{ stratName }}</span>
      <i class="ph ph-caret-down" style="font-size:9px;color:var(--color-neutral-500)"></i>
    </button>
    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 7px;font:400 12px/1 'JetBrains Mono',monospace;color:{{ valColor }}">
      <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ shown }}</span>
      <sc-if value="{{ isTyping }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:1px;height:14px;background:var(--color-accent-300);margin-left:-5px"></span></sc-if>
      <sc-if value="{{ isPending }}" hint-placeholder-val="{{ false }}"><span title="Pending: typed text differs from the saved selector. Enter or the closing button applies it." style="flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:500 10px/1 var(--font-body);color:oklch(0.86 0.1 80)"><span style="width:6px;height:6px;border-radius:50%;background:oklch(0.82 0.13 80)"></span>pending</span></sc-if><sc-if value="{{ isPicked }}" hint-placeholder-val="{{ false }}"><span style="flex:none;margin-left:auto;padding:2px 5px;border-radius:3px;background:var(--color-accent-900);color:var(--color-accent-300);font:500 10px/1 var(--font-body)">picked</span></sc-if>
    </div>
    <div title="Live match count" style="flex:none;display:flex;align-items:center;gap:3px;padding:0 6px;font:600 11px/1 'JetBrains Mono',monospace;color:{{ countColor }}">
      <sc-if value="{{ isInvalid }}" hint-placeholder-val="{{ false }}"><i class="ph-bold ph-warning" style="font-size:11px"></i></sc-if>{{ countText }}
    </div>
    <button title="Pick on page (P)" style="flex:none;width:26px;display:flex;align-items:center;justify-content:center;border:0;border-left:1px solid var(--color-neutral-800);background:{{ pickBg }};color:{{ pickColor }};cursor:pointer" style-hover="background:var(--color-accent-900);color:var(--color-accent-300)"><i class="ph ph-crosshair-simple" style="font-size:14px"></i></button>
    <button title="Candidates" style="flex:none;display:flex;align-items:center;gap:3px;padding:0 6px;border:0;border-left:1px solid var(--color-neutral-800);background:transparent;color:var(--color-neutral-400);font:500 11px/1 'JetBrains Mono',monospace;cursor:pointer" style-hover="background:var(--color-neutral-900);color:var(--color-neutral-200)">{{ candText }}<i class="ph ph-caret-down" style="font-size:9px"></i></button>
  </div>
  <sc-if value="{{ isInvalid }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;line-height:1.35;color:oklch(0.74 0.14 25);padding-left:2px">{{ error }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:60},&quot;strategy&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;role&quot;,&quot;testid&quot;,&quot;id&quot;,&quot;class&quot;,&quot;text&quot;,&quot;css&quot;,&quot;xpath&quot;],&quot;default&quot;:&quot;css&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;a &gt; h3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;empty&quot;,&quot;typed&quot;,&quot;pending&quot;,&quot;invalid&quot;,&quot;picked&quot;],&quot;default&quot;:&quot;typed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:11,&quot;tsType&quot;:&quot;number&quot;},&quot;candidates&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const state = p.state ?? 'typed';
    const s = p.strategy ?? 'css';
    const G = { role: { i: 'ph-bold ph-person-simple' }, testid: { i: 'ph-bold ph-flask' }, id: { t: '#' }, class: { t: '.' }, text: { i: 'ph-bold ph-text-t' }, css: { t: '{}' }, xpath: { t: '//' } };
    const g = G[s] || G.css;
    const empty = state === 'empty', invalid = state === 'invalid', picked = state === 'picked';
    const n = Number(p.count ?? 11);
    return {
      hasIcon: !!g.i, glyphIcon: g.i || '', hasText: !g.i, glyphText: g.t || '', stratName: s === 'testid' ? 'testid' : s,
      shown: empty ? (p.placeholder ?? 'selector, or paste strategy=value') : (p.value ?? ''),
      valColor: empty ? 'var(--color-neutral-600)' : 'var(--color-text)',
      isTyping: (state === 'typed' || state === 'pending') && !!p.caret, isPicked: picked, isInvalid: invalid, isPending: state === 'pending',
      border: invalid ? 'oklch(0.62 0.15 25)' : state === 'pending' ? 'oklch(0.72 0.11 80)' : picked ? 'var(--color-accent)' : state === 'typed' ? 'var(--color-accent-700)' : 'var(--color-neutral-800)',
      glow: picked ? '0 0 0 3px color-mix(in srgb,var(--color-accent) 18%,transparent)' : invalid ? '0 0 0 3px color-mix(in srgb,oklch(0.62 0.15 25) 16%,transparent)' : 'none',
      countText: empty ? '—' : invalid ? (p.count != null ? String(n) : 'err') : String(n),
      countColor: empty ? 'var(--color-neutral-600)' : invalid ? 'oklch(0.74 0.14 25)' : n === 0 ? 'oklch(0.74 0.14 25)' : 'oklch(0.8 0.12 155)',
      pickBg: picked ? 'var(--color-accent-900)' : 'transparent', pickColor: picked ? 'var(--color-accent-300)' : 'var(--color-neutral-400)',
      candText: empty ? '0' : String(p.candidates ?? 6),
      error: p.error ?? 'Unexpected ">" at col 1 — did you mean :scope > div?'
    };
  }
}
</script>
</body>
</html>
