<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-53929d40-05df-499c-bc14-17884e999fc5/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="_ds/nocturne-53929d40-05df-499c-bc14-17884e999fc5/_ds_bundle.js"></script>
</helmet>
<span title="{{ full }}" style="display:inline-flex;align-items:center;height:20px;max-width:100%;min-width:0;box-sizing:border-box;border-radius:4px;background:color-mix(in srgb,var(--color-surface) 70%,var(--color-bg));border:1px solid var(--color-neutral-800);border-left:3px solid {{ stripe }};font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--color-neutral-200);vertical-align:middle;overflow:hidden;cursor:default">
  <span title="{{ stratName }}" style="flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:100%;padding:0 3px;box-sizing:border-box;background:color-mix(in srgb,var(--color-neutral-800) 55%,transparent);color:var(--color-neutral-300);font:700 10px/1 'JetBrains Mono',monospace">
    <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><i class="{{ glyphIcon }}" style="font-size:11px"></i></sc-if>
    <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}">{{ glyphText }}</sc-if>
  </span>
  <span style="display:inline-flex;align-items:center;gap:4px;padding:0 6px;min-width:0">
    <sc-if value="{{ direct }}" hint-placeholder-val="{{ false }}"><span title="direct child (:scope &gt;)" style="flex:none;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:3px;background:var(--color-accent-900);color:var(--color-accent-300);font:700 10px/1 var(--font-body)">↳</span></sc-if>
    <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ main }}<span style="color:var(--color-accent-200)">{{ quoted }}</span></span>
    <span title="{{ stabLabel }}" style="flex:none;width:6px;height:6px;border-radius:50%;background:{{ dot }}"></span>
  </span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:40},&quot;strategy&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;role&quot;,&quot;testid&quot;,&quot;id&quot;,&quot;class&quot;,&quot;text&quot;,&quot;css&quot;,&quot;xpath&quot;],&quot;default&quot;:&quot;css&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;:scope &gt; div &gt; div&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;item&quot;,&quot;field&quot;,&quot;page&quot;],&quot;default&quot;:&quot;item&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stable&quot;,&quot;medium&quot;,&quot;fragile&quot;],&quot;default&quot;:&quot;medium&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const s = p.strategy ?? 'css';
    const raw = p.value ?? '';
    let v = raw, direct = false;
    if (/^:scope\s*>\s*/.test(v)) { direct = true; v = v.replace(/^:scope\s*>\s*/, ''); }
    let main = v, quoted = '';
    if (s === 'role' && v.includes('|')) { const i = v.indexOf('|'); main = v.slice(0, i); quoted = ' "' + v.slice(i + 1) + '"'; }
    if (s === 'text') { main = ''; quoted = '"' + v + '"'; }
    if (s === 'id') main = v.replace(/^#/, '');
    if (s === 'class') main = v.replace(/^\./, '');
    if (s === 'xpath') main = v.replace(/^\/\//, '');
    const G = { role: { i: 'ph-bold ph-person-simple', n: 'role' }, testid: { i: 'ph-bold ph-flask', n: 'test id' }, id: { t: '#', n: 'id' }, class: { t: '.', n: 'class' }, text: { i: 'ph-bold ph-text-t', n: 'text' }, css: { t: '{}', n: 'css' }, xpath: { t: '//', n: 'xpath' } };
    const g = G[s] || G.css;
    const L = { list: 'oklch(0.74 0.09 235)', item: 'var(--color-accent)', field: 'oklch(0.76 0.11 340)', page: 'var(--color-neutral-500)' };
    const S = { stable: ['oklch(0.78 0.13 155)', 'stable'], medium: ['oklch(0.82 0.13 80)', 'medium stability'], fragile: ['oklch(0.68 0.17 25)', 'fragile'] };
    const st = S[p.stab ?? 'stable'] || S.stable;
    return {
      full: s + '=' + raw + '  ·  ' + st[1], stratName: g.n,
      hasIcon: !!g.i, glyphIcon: g.i || '', hasText: !g.i, glyphText: g.t || '',
      direct, main, quoted, stripe: L[p.level ?? 'field'] || L.field, dot: st[0], stabLabel: st[1]
    };
  }
}
</script>
</body>
</html>
